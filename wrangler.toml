# Cloudflare Deploy Button configuration. Keep this at the repository root so
# Cloudflare detects it without needing a monorepo-specific config path.
name = "cardgem-statusping"
main = "adapters/cloudflare/worker.ts"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "cardgem-statusping"
# Cloudflare replaces this placeholder during the Deploy Button flow.
database_id = "26e02a8e-0417-4b9f-81ed-5ee6f966ea76"

[[durable_objects.bindings]]
name = "REGIONAL_PROBE"
class_name = "RegionalProbe"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RegionalProbe"]

[vars]
STATUSPING_TEMPLATE_VERSION = "0.2.5"
STATUSPING_ROLE = "primary"
